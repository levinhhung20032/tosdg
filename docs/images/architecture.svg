<path d="M 1447 438 L 1447 466" fill="none" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="380" y="690" width="890" height="96" rx="8" fill="#f3effd" stroke="#7c5cc4" stroke-width="1.6"/>
<text x="392" y="714" font-size="16" font-weight="600" fill="#1f2937">Studio — công cụ web cục bộ (127.0.0.1:8765)</text>
<text x="392" y="733" font-size="13.5" fill="#1f2937">upload ảnh nền, đặt camera, kéo skeleton (IK), Gesture match, Generator check, Render preview, Random generate. Dùng</text>
<text x="392" y="752" font-size="13.5" fill="#1f2937">chung động học, phép chiếu và renderer với generator nên xem trước khớp với dữ liệu sinh ra.</text>
<text x="392" y="770" font-size="12" font-family="Consolas, monospace" fill="#5b6472">src/tosdg/studio/</text>
