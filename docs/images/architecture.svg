<text x="984" y="276" font-size="15" font-weight="700" fill="#3b7fc4">RENDER BACKEND</text>
<rect x="990" y="288" width="260" height="54" rx="8" fill="#eaf4ff" stroke="#3b7fc4" stroke-width="1.6"/>
<text x="1002" y="312" font-size="15" font-weight="600" fill="#1f2937">proxy</text>
<text x="1002" y="331" font-size="13.5" fill="#1f2937">capsule tô bóng — để test</text>
<rect x="990" y="352" width="260" height="54" rx="8" fill="#eaf4ff" stroke="#3b7fc4" stroke-width="1.6"/>
<text x="1002" y="376" font-size="15" font-weight="600" fill="#1f2937">mesh CPU</text>
<text x="1002" y="395" font-size="13.5" fill="#1f2937">skinning + z-buffer numpy</text>
<rect x="990" y="416" width="260" height="54" rx="8" fill="#eaf4ff" stroke="#3b7fc4" stroke-width="1.6"/>
<text x="1002" y="440" font-size="15" font-weight="600" fill="#1f2937">mesh GPU</text>
<text x="1002" y="459" font-size="13.5" fill="#1f2937">OpenGL: PBR, bóng, SSAO</text>
<rect x="990" y="480" width="260" height="54" rx="8" fill="#eaf4ff" stroke="#3b7fc4" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="1002" y="504" font-size="15" font-weight="600" fill="#1f2937">Unreal</text>
<text x="1002" y="523" font-size="13.5" fill="#1f2937">renderer sản phẩm — dự kiến</text>
<path d="M 888 365 L 968 365" fill="none" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="928" y="357" font-size="12.5" font-style="italic" fill="#1f2937" text-anchor="middle">Scene</text>
<path d="M 968 500 L 930 500 L 930 484 L 890 484" fill="none" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="930" y="520" font-size="12.5" font-style="italic" fill="#1f2937" text-anchor="middle">RGB + mask</text>
<text x="1320" y="104" font-size="15" font-weight="700" fill="#5b6472">ĐẦU RA</text>
<rect x="1320" y="116" width="255" height="110" rx="8" fill="#ebf9f1" stroke="#2f9e62" stroke-width="1.6"/>
<text x="1332" y="140" font-size="16" font-weight="600" fill="#1f2937">Dataset</text>
<text x="1332" y="159" font-size="13.5" fill="#1f2937">&lt;id&gt;.rgb · &lt;id&gt;.mask.png ·</text>
<text x="1332" y="178" font-size="13.5" fill="#1f2937">&lt;id&gt;.json · manifest.json (hash</text>
<text x="1332" y="197" font-size="13.5" fill="#1f2937">từng file)</text>
<rect x="1320" y="256" width="255" height="76" rx="8" fill="#ebf9f1" stroke="#2f9e62" stroke-width="1.6"/>
<text x="1332" y="280" font-size="16" font-weight="600" fill="#1f2937">validate · reproduce</text>
<text x="1332" y="299" font-size="13.5" fill="#1f2937">kiểm tra lại, sinh lại giống</text>
<text x="1332" y="318" font-size="13.5" fill="#1f2937">từng byte</text>
<rect x="1320" y="362" width="255" height="76" rx="8" fill="#ebf9f1" stroke="#2f9e62" stroke-width="1.6"/>
<text x="1332" y="386" font-size="16" font-weight="600" fill="#1f2937">export</text>
<text x="1332" y="405" font-size="13.5" fill="#1f2937">COCO · YOLO-pose · CVAT, chia</text>
<text x="1332" y="424" font-size="13.5" fill="#1f2937">train / val / test</text>
<rect x="1320" y="468" width="255" height="76" rx="8" fill="#ebf9f1" stroke="#2f9e62" stroke-width="1.6"/>
<text x="1332" y="492" font-size="16" font-weight="600" fill="#1f2937">Huấn luyện / gán nhãn</text>
<text x="1332" y="511" font-size="13.5" fill="#1f2937">notebook YOLO11-pose; mở lại</text>
<text x="1332" y="530" font-size="13.5" fill="#1f2937">trong CVAT</text>
<path d="M 888 600 L 930 600 L 930 664 L 1295 664 L 1295 171 L 1318 171" fill="none" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="1110" y="656" font-size="12.5" font-style="italic" fill="#1f2937" text-anchor="middle">mẫu đạt</text>
