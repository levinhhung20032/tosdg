<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/></marker>
<marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
</defs>
<rect width="1600" height="830" fill="#ffffff"/>
<text x="30" y="40" font-size="24" font-weight="700" fill="#1f2937">tosdg — kiến trúc hệ thống</text>
<text x="30" y="64" font-size="14" fill="#5b6472">Kiến thức quốc gia nằm trong JSON; phần lõi Python độc lập với engine; renderer chỉ biến Scene thành điểm ảnh + mask.</text>
<text x="30" y="104" font-size="15" font-weight="700" fill="#5b6472">ĐẦU VÀO (file JSON / GLB / ảnh)</text>
<rect x="30" y="116" width="300" height="92" rx="8" fill="#f5f7fa" stroke="#c3cad6" stroke-width="1.6"/>
<text x="42" y="140" font-size="16" font-weight="600" fill="#1f2937">Generation config</text>
<text x="42" y="159" font-size="13.5" fill="#1f2937">seed, số mẫu, độ phân giải, backend,</text>
<text x="42" y="178" font-size="13.5" fill="#1f2937">trọng số cử chỉ / camera</text>
<text x="42" y="196" font-size="12" font-family="Consolas, monospace" fill="#5b6472">configs/*.json</text>
<path d="M 330 162 L 378 162" fill="none" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="30" y="220" width="300" height="92" rx="8" fill="#f5f7fa" stroke="#c3cad6" stroke-width="1.6"/>
<text x="42" y="244" font-size="16" font-weight="600" fill="#1f2937">Profile quốc gia</text>
<text x="42" y="263" font-size="13.5" fill="#1f2937">15 cử chỉ + lệnh cho từng phía, camera</text>
<text x="42" y="282" font-size="13.5" fill="#1f2937">profile, uniform</text>
<text x="42" y="300" font-size="12" font-family="Consolas, monospace" fill="#5b6472">profiles/VN/*.json</text>
<path d="M 330 266 L 378 266" fill="none" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="30" y="324" width="300" height="92" rx="8" fill="#f5f7fa" stroke="#c3cad6" stroke-width="1.6"/>
<text x="42" y="348" font-size="16" font-weight="600" fill="#1f2937">Skeleton + pose</text>
<text x="42" y="367" font-size="13.5" fill="#1f2937">67 khớp, giới hạn DOF giải phẫu, pose</text>
<text x="42" y="386" font-size="13.5" fill="#1f2937">thân và bàn tay</text>
<text x="42" y="404" font-size="12" font-family="Consolas, monospace" fill="#5b6472">characters/, poses/</text>
<path d="M 330 370 L 378 370" fill="none" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="30" y="428" width="300" height="92" rx="8" fill="#f5f7fa" stroke="#c3cad6" stroke-width="1.6"/>
<text x="42" y="452" font-size="16" font-weight="600" fill="#1f2937">Model 3D + prop</text>
<text x="42" y="471" font-size="13.5" fill="#1f2937">GLB có skin (rig UE5), baton, bục giao</text>
<text x="42" y="490" font-size="13.5" fill="#1f2937">thông</text>
<text x="42" y="508" font-size="12" font-family="Consolas, monospace" fill="#5b6472">profiles/VN/assets/</text>
<path d="M 330 474 L 378 474" fill="none" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="30" y="532" width="300" height="92" rx="8" fill="#f5f7fa" stroke="#c3cad6" stroke-width="1.6"/>
<text x="42" y="556" font-size="16" font-weight="600" fill="#1f2937">Thư viện ảnh nền</text>
<text x="42" y="575" font-size="13.5" fill="#1f2937">50 ảnh VN; mask mặt đường, người / xe,</text>
<text x="42" y="594" font-size="13.5" fill="#1f2937">bố cục giao lộ</text>
<text x="42" y="612" font-size="12" font-family="Consolas, monospace" fill="#5b6472">data/backgrounds/index.json</text>
<path d="M 330 578 L 378 578" fill="none" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="380" y="84" width="530" height="560" rx="12" fill="#fff7e6" fill-opacity="0.55" stroke="#e0a526" stroke-width="2"/>
<text x="394" y="110" font-size="15" font-weight="700" fill="#e0a526">PHẦN LÕI  src/tosdg  —  mọi ngẫu nhiên: rng.stream(seed, tên)</text>
<rect x="402" y="122" width="486" height="92" rx="8" fill="#fff7e6" stroke="#e0a526" stroke-width="1.6"/>
<text x="414" y="146" font-size="16" font-weight="600" fill="#1f2937">1 · Cử chỉ → pose</text>
<text x="414" y="165" font-size="13.5" fill="#1f2937">biến thể pose có trọng số + lệch ngẫu nhiên; loại nếu vượt giới</text>
<text x="414" y="184" font-size="13.5" fill="#1f2937">hạn khớp, tự va chạm, sai ràng buộc hình học</text>
<text x="414" y="202" font-size="12" font-family="Consolas, monospace" fill="#5b6472">gestures.py  skeleton.py  poses.py</text>
<rect x="402" y="226" width="486" height="92" rx="8" fill="#fff7e6" stroke="#e0a526" stroke-width="1.6"/>
<text x="414" y="250" font-size="16" font-weight="600" fill="#1f2937">2 · Camera + ảnh nền</text>
<text x="414" y="269" font-size="13.5" fill="#1f2937">hiệu chỉnh độ cao / chân trời từ người và xe, đứng giữa giao lộ,</text>
<text x="414" y="288" font-size="13.5" fill="#1f2937">chân trên mặt đường</text>
<text x="414" y="306" font-size="12" font-family="Consolas, monospace" fill="#5b6472">calibrate.py  junction.py  ground.py  lens.py</text>
<rect x="402" y="330" width="486" height="70" rx="8" fill="#fff7e6" stroke="#e0a526" stroke-width="1.6"/>
<text x="414" y="354" font-size="16" font-weight="600" fill="#1f2937">3 · Ánh sáng → Scene (dữ liệu thuần)</text>
<text x="414" y="373" font-size="13.5" fill="#1f2937">khớp độ sáng ảnh nền, giới hạn exposure</text>
<rect x="402" y="438" width="486" height="92" rx="8" fill="#fff7e6" stroke="#e0a526" stroke-width="1.6"/>
<text x="414" y="462" font-size="16" font-weight="600" fill="#1f2937">4 · Ground truth (không ước lượng)</text>
<text x="414" y="481" font-size="13.5" fill="#1f2937">keypoint = FK + phép chiếu camera; bbox từ instance mask; che</text>
<text x="414" y="500" font-size="13.5" fill="#1f2937">khuất; lệnh cho phía camera đứng</text>
<text x="414" y="518" font-size="12" font-family="Consolas, monospace" fill="#5b6472">groundtruth.py</text>
<rect x="402" y="542" width="486" height="88" rx="8" fill="#fff7e6" stroke="#e0a526" stroke-width="1.6"/>
<text x="414" y="566" font-size="16" font-weight="600" fill="#1f2937">5 · Kiểm tra từng mẫu</text>
<text x="414" y="585" font-size="13.5" fill="#1f2937">ảnh, bbox, keypoint, độ sáng, schema → đạt: ghi ra; lỗi: bốc lại</text>
<text x="414" y="604" font-size="13.5" fill="#1f2937">(không bao giờ ghi mẫu lỗi)</text>
<text x="414" y="622" font-size="12" font-family="Consolas, monospace" fill="#5b6472">validate.py</text>
