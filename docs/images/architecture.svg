<line x1="1320" y1="746" x2="1360" y2="746" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="6 5"/><text x="1368" y="751" font-size="13" fill="#5b6472">bốc lại khi mẫu lỗi</text>
